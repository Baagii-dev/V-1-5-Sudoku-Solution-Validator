<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku Validator – UI жишээ</title>
<style>
body{font-family:-apple-system,Segoe UI,sans-serif;background:#fafaf8;color:#222;padding:24px}
.g{display:grid;grid-template-columns:repeat(9,36px);border:2px solid #444;width:max-content}
.c{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:16px;border:0.5px solid #ccc;background:#fff}
.c.r{background:#e6f1fb}.c.k{background:#eaf3de}.c.b{background:#faeeda}.c.bad{background:#fcebeb;color:#a32d2d;font-weight:600}
.tr{display:flex;justify-content:space-between;font-size:14px;padding:5px 10px;border-bottom:1px solid #eee}
.lg{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:#666;margin-right:12px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
button,select{font-size:14px;padding:6px 12px}
</style>
</head>
<body>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px">
<select id="sel"><option value="cell">invalid_cell.txt</option><option value="ok">valid_book.txt</option><option value="row">invalid_row.txt</option><option value="col">invalid_col.txt</option></select>
<button id="run">▶ Ажиллуулах</button>
<button id="rst">⟲ Reset</button>
<span id="res" style="font-size:15px;font-weight:600"></span>
</div>
<div style="display:flex;gap:24px;flex-wrap:wrap">
<div><div class="g" id="g"></div>
<div style="margin-top:8px"><span class="lg"><span class="sw" style="background:#e6f1fb"></span>Мөрийн урсгал</span><span class="lg"><span class="sw" style="background:#eaf3de"></span>Баганын</span><span class="lg"><span class="sw" style="background:#faeeda"></span>Дэд хүснэгтийн</span><span class="lg"><span class="sw" style="background:#fcebeb"></span>Алдаа</span></div></div>
<div style="min-width:240px;border:1px solid #ddd;border-radius:12px;padding:6px 0;background:#fff" id="th"></div>
</div>
<script>
const B=[[6,2,4,5,3,9,1,8,7],[5,1,9,7,2,8,6,3,4],[8,3,7,6,1,4,2,9,5],[1,4,3,8,6,5,7,2,9],[9,5,8,2,4,7,3,6,1],[7,6,2,3,9,1,4,5,8],[3,7,1,9,5,6,8,4,2],[4,9,6,1,8,2,5,7,3],[2,8,5,4,7,3,9,1,6]];
const sel=document.getElementById('sel'),g=document.getElementById('g'),th=document.getElementById('th'),res=document.getElementById('res');
let bd,timer,bad=new Set(),st={};
function load(){bd=B.map(r=>r.slice());const v=sel.value;if(v=='cell')bd[0][0]=7;if(v=='row'){bd[0][0]=5;bd[1][0]=6}if(v=='col'){bd[0][0]=2;bd[0][1]=6}}
const names=['Мөр (T1)','Багана (T2)'].concat([...Array(9)].map((_,i)=>'Дэд хүснэгт '+(i+1)+' (T'+(i+3)+')'));
function draw(hl){g.innerHTML='';for(let r=0;r<9;r++)for(let c=0;c<9;c++){const d=document.createElement('div');d.className='c';d.textContent=bd[r][c];const k=r*9+c;if(bad.has(k))d.classList.add('bad');else if(hl){if(hl.b(r,c))d.classList.add('b');if(hl.k(r,c))d.classList.add('k');if(hl.r(r,c))d.classList.add('r')}if(c%3==2&&c<8)d.style.borderRight='2px solid #444';if(r%3==2&&r<8)d.style.borderBottom='2px solid #444';g.appendChild(d)}
th.innerHTML=names.map((n,i)=>{const s=st[i]||'хүлээж буй';const col=s=='OK'?'#3b6d11':s=='АЛДАА'?'#a32d2d':'#888';return '<div class="tr"><span>'+n+'</span><span style="color:'+col+'">'+s+'</span></div>'}).join('')}
const ok=a=>new Set(a).size==9;
function reset(){clearInterval(timer);bad=new Set();st={};res.textContent='';load();draw()}
function run(){reset();for(let i=0;i<11;i++)st[i]='ажиллаж байна';let t=0;
timer=setInterval(()=>{if(t>8){clearInterval(timer);for(let i=0;i<11;i++)if(st[i]=='ажиллаж байна')st[i]='OK';draw();const v=Object.values(st).every(s=>s=='OK');res.textContent=v?'Зөв шийд':'Буруу шийд';res.style.color=v?'#3b6d11':'#a32d2d';return}
const br=Math.floor(t/3)*3,bc=(t%3)*3;
if(!ok(bd[t])){st[0]='АЛДАА';for(let c=0;c<9;c++)bad.add(t*9+c)}
if(!ok(bd.map(r=>r[t]))){st[1]='АЛДАА';for(let r=0;r<9;r++)bad.add(r*9+t)}
const bx=[];for(let r=br;r<br+3;r++)for(let c=bc;c<bc+3;c++)bx.push(bd[r][c]);
st[t+2]=ok(bx)?'OK':'АЛДАА';if(!ok(bx))for(let r=br;r<br+3;r++)for(let c=bc;c<bc+3;c++)bad.add(r*9+c);
const tt=t;draw({r:r=>r==tt,k:(r,c)=>c==tt,b:(r,c)=>r>=br&&r<br+3&&c>=bc&&c<bc+3});t++},650)}
sel.onchange=reset;document.getElementById('rst').onclick=reset;document.getElementById('run').onclick=run;reset();
</script>
</body>
</html>
